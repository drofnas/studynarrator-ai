appId: io.github.drofnas.studynarrator
productName: StudyNarrator
electronVersion: 43.3.0
directories:
  output: release
  buildResources: build
files:
  - dist/**
extraResources:
  - from: ../web/dist
    to: web/dist
asar: true
asarUnpack:
  - node_modules/better-sqlite3/prebuilds/*.node
mac:
  icon: icon.icns
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - arm64
        - x64
win:
  icon: icon.ico
  target:
    - target: nsis
      arch:
        - x64
linux:
  icon: icons
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
