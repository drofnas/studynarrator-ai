name: studynarrator

services:
  study-narrator:
    image: studynarrator:${STUDYNARRATOR_IMAGE_TAG:-0.1.0}
    build:
      context: .
      args:
        STUDYNARRATOR_SOURCE_REVISION: ${STUDYNARRATOR_SOURCE_REVISION:-local}
        STUDYNARRATOR_VERSION: ${STUDYNARRATOR_IMAGE_TAG:-0.1.0}
    ports:
      - "${STUDYNARRATOR_BIND_ADDRESS:-127.0.0.1}:${STUDYNARRATOR_HOST_PORT:-8080}:4310"
    environment:
      STUDYNARRATOR_DATA_DIR: /data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - studynarrator-data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  studynarrator-data:
